<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background circle -->
  <rect width="400" height="400" fill="url(#bgGrad)" rx="200" />
  <circle cx="200" cy="200" r="190" fill="none" stroke="url(#neonGlow)" stroke-width="4" stroke-dasharray="10 5" opacity="0.6"/>

  <!-- Code brackets background effect -->
  <text x="70" y="140" fill="#38bdf8" opacity="0.15" font-family="monospace" font-size="64" font-weight="bold">&lt;/&gt;</text>
  <text x="260" y="270" fill="#818cf8" opacity="0.15" font-family="monospace" font-size="52" font-weight="bold">{ ; }</text>

  <!-- Avatar body -->
  <g id="avatar">
    <!-- Shoulders / Hood -->
    <path d="M 110 350 C 110 270, 150 260, 200 260 C 250 260, 290 270, 290 350 Z" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <path d="M 140 350 C 140 290, 170 280, 200 280 C 230 280, 260 290, 260 350 Z" fill="#0f172a" />
    
    <!-- Neck -->
    <rect x="180" y="220" width="40" height="50" rx="10" fill="#fbcfe8" opacity="0.8"/>

    <!-- Head -->
    <ellipse cx="200" cy="180" rx="55" ry="65" fill="#fde68a" />

    <!-- Hair -->
    <path d="M 140 170 C 135 120, 170 100, 200 100 C 235 100, 265 115, 260 170 C 250 135, 230 120, 200 125 C 170 130, 150 145, 140 170 Z" fill="#1e1b4b" />
    <!-- Bangs -->
    <path d="M 150 150 Q 180 125 210 145 Q 240 130 250 160 Q 220 140 150 150 Z" fill="#1e1b4b" />

    <!-- Glasses -->
    <rect x="155" y="165" width="38" height="26" rx="6" fill="rgba(56, 189, 248, 0.15)" stroke="#38bdf8" stroke-width="3" filter="url(#glow)"/>
    <rect x="207" y="165" width="38" height="26" rx="6" fill="rgba(56, 189, 248, 0.15)" stroke="#38bdf8" stroke-width="3" filter="url(#glow)"/>
    <line x1="193" y1="178" x2="207" y2="178" stroke="#38bdf8" stroke-width="3" />

    <!-- Eyes inside glasses -->
    <circle cx="174" cy="178" r="4" fill="#0f172a" />
    <circle cx="226" cy="178" r="4" fill="#0f172a" />
    <circle cx="176" cy="176" r="1.5" fill="#ffffff" />
    <circle cx="228" cy="176" r="1.5" fill="#ffffff" />

    <!-- Smile -->
    <path d="M 185 215 Q 200 228 215 215" fill="none" stroke="#b45309" stroke-width="3" stroke-linecap="round"/>

    <!-- Developer Headphone -->
    <path d="M 135 180 A 65 65 0 0 1 265 180" fill="none" stroke="#64748b" stroke-width="8" stroke-linecap="round"/>
    <rect x="130" y="170" width="14" height="32" rx="7" fill="#38bdf8" />
    <rect x="256" y="170" width="14" height="32" rx="7" fill="#38bdf8" />
  </g>

  <!-- Dev Badge -->
  <g transform="translate(140, 335)">
    <rect width="120" height="30" rx="15" fill="#0284c7" stroke="#38bdf8" stroke-width="2"/>
    <text x="60" y="20" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">BẢO 2 • DEV</text>
  </g>
</svg>
