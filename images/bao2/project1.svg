<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" width="100%" height="100%">
  <defs>
    <linearGradient id="p1Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
  </defs>
  <rect width="600" height="350" rx="16" fill="url(#p1Grad)" />
  
  <!-- Browser top bar -->
  <rect width="600" height="42" fill="#1e293b" rx="16" />
  <rect y="20" width="600" height="22" fill="#1e293b" />
  <circle cx="28" cy="21" r="6" fill="#ef4444" />
  <circle cx="48" cy="21" r="6" fill="#f59e0b" />
  <circle cx="68" cy="21" r="6" fill="#10b981" />
  <rect x="100" y="10" width="400" height="22" rx="11" fill="#0f172a" opacity="0.6" />
  <text x="300" y="26" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">https://chat-network.dev/room-nhom3</text>

  <!-- Chat UI Mockup -->
  <!-- Sidebar -->
  <rect x="20" y="60" width="150" height="270" rx="10" fill="#1e293b" opacity="0.7" />
  <rect x="35" y="78" width="120" height="14" rx="4" fill="#38bdf8" opacity="0.4" />
  <rect x="35" y="105" width="100" height="10" rx="3" fill="#64748b" opacity="0.4" />
  <rect x="35" y="130" width="110" height="28" rx="6" fill="#0284c7" opacity="0.3" />
  <circle cx="50" cy="144" r="7" fill="#38bdf8" />
  <rect x="65" y="140" width="65" height="8" rx="2" fill="#ffffff" />
  
  <rect x="35" y="170" width="110" height="28" rx="6" fill="#334155" opacity="0.4" />
  <circle cx="50" cy="184" r="7" fill="#64748b" />
  <rect x="65" y="180" width="55" height="8" rx="2" fill="#94a3b8" />

  <!-- Chat Area -->
  <rect x="185" y="60" width="395" height="270" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1" />
  
  <!-- Message left -->
  <rect x="205" y="85" width="180" height="42" rx="12" fill="#1e293b" />
  <text x="220" y="105" fill="#f8fafc" font-family="sans-serif" font-size="12">Server Socket connected!</text>
  <text x="220" y="120" fill="#38bdf8" font-family="sans-serif" font-size="10">TCP Port 8080 • Online</text>

  <!-- Message right -->
  <rect x="375" y="145" width="185" height="42" rx="12" fill="#0284c7" />
  <text x="390" y="165" fill="#ffffff" font-family="sans-serif" font-size="12">Gia Bảo: Đã đồng bộ WebRTC</text>
  <text x="390" y="180" fill="#bae6fd" font-family="sans-serif" font-size="10">Độ trễ: 12ms • P2P Active</text>

  <!-- Message left 2 -->
  <rect x="205" y="205" width="210" height="40" rx="12" fill="#1e293b" />
  <text x="220" y="225" fill="#f8fafc" font-family="sans-serif" font-size="12">Nhóm 3: Test phòng audio thành công! 🎧</text>

  <!-- Input Bar -->
  <rect x="205" y="275" width="310" height="38" rx="19" fill="#1e293b" />
  <text x="225" y="299" fill="#64748b" font-family="sans-serif" font-size="12">Nhập tin nhắn...</text>
  <circle cx="545" cy="294" r="18" fill="url(#accentGrad)" />
  <polygon points="540,287 554,294 540,301" fill="#ffffff" />
</svg>
